<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans min-h-screen transition-colors duration-500" id="body">
    
    <!-- Theme Toggle Button -->
    <button id="themeToggle" aria-label="Basculer le thème" class="fixed top-4 right-4 p-3 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 text-white hover:bg-white/20 transition z-50 shadow-lg">
        <svg id="iconLight" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun w-6 h-6 text-yellow-400 hidden">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg id="iconDark" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon w-6 h-6 text-white">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
    </button>

    <div class="min-h-screen flex flex-col items-center pt-16 pb-8 p-4 transition-colors duration-500" id="appContainer">
        
        <!-- Header -->
        <header class="w-full max-w-3xl mb-8 text-center">
            <h1 class="text-5xl font-extrabold tracking-tight mb-2" id="appTitle">Mini Note</h1>
            <p class="text-lg" id="appSubtitle">Capturez vos pensées rapidement.</p>
        </header>

        <!-- Note Input Area -->
        <div class="w-full max-w-3xl mb-8">
            <div id="inputArea" class="p-6 rounded-2xl shadow-2xl transition-all duration-500 border-2 border-transparent">
                <input type="text" id="noteTitle" placeholder="Titre de la note..." class="w-full p-3 mb-3 text-lg rounded-lg focus:ring-2 focus:ring-offset-0 outline-none transition-all duration-300" aria-label="Titre de la note">
                <textarea id="noteContent" placeholder="Écrivez votre contenu ici..." rows="5" class="w-full p-4 text-base rounded-lg resize-none focus:ring-2 focus:ring-offset-0 outline-none transition-all duration-300" aria-label="Contenu de la note"></textarea>
                <button id="addNoteBtn" class="mt-3 w-full py-3 rounded-xl font-semibold text-white shadow-lg transition-all duration-300 transform hover:scale-[1.01] flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    Ajouter la Note
                </button>
            </div>
        </div>

        <!-- Notes List -->
        <div class="w-full max-w-3xl">
            <h2 class="text-2xl font-bold mb-4" id="notesHeader">Notes Récentes</h2>
            <div id="notesList" class="space-y-4">
                <!-- Notes will be inserted here by JavaScript -->
            </div>
            <p id="emptyMessage" class="text-center p-8 text-lg italic opacity-70 hidden">Aucune note pour le moment. Commencez à écrire !</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
